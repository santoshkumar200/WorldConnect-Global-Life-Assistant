name: worldconnect
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  fl_chart: ^1.2.0
  hive: ^2.2.3
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^21.0.0
  translator: ^1.0.4+1
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.3
  lottie: ^3.3.3
  hive_flutter: ^1.1.0
  video_player: ^2.8.6            # ← splash video ke liye add kiya

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1  # ← launcher icons package

# ⚠️ Top‑level (flutter ke bahar) likho
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true

  # Assets folder ki files
  assets:
    - assets/app_icon.png
    - assets/videos/splash_intro.mp4   # agar splash video hai to